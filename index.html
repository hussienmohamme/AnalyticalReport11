<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هندسة اليوم الدراسي الجديد — مدارس النبلاء الأهلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6E2439; --maroon-dark:#4A1626; --maroon-light:#8C3350; --maroon-tint:#F3E6EA;
    --gold:#B8923F; --gold-light:#E9DBB2; --gold-glow:#EFCB78;
    --cream:#FBF7EF; --paper:#F3ECDD; --ink:#2A211D; --ink-soft:#5B4F49; --line:#E1D3B0;
    --risk:#9C3B2E; --risk-tint:#F5E4DF; --target:#3E6B4A; --target-tint:#E7EFE5;
    --shadow: 0 14px 34px -16px rgba(74,22,38,.4);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Tajawal',sans-serif; line-height:1.85; font-size:16.5px; overflow-x:hidden;}
  h1,h2,h3,h4{font-family:'Aref Ruqaa',serif; font-weight:700; color:var(--maroon-dark); line-height:1.3;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--gold-light);}

  .topbar{position:sticky; top:0; z-index:70; background:rgba(251,247,239,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1240px; margin:0 auto; padding:10px 22px; display:flex; align-items:center; gap:14px;}
  .topbar img{height:38px;}
  .topbar .brandtext strong{display:block; font-size:14.5px; color:var(--maroon-dark); font-weight:700;}
  .topbar .brandtext span{font-size:12px; color:var(--ink-soft);}
  .navpills{margin-inline-start:auto; display:flex; gap:8px;}
  .navpills a{font-size:13.5px; color:var(--maroon-dark); text-decoration:none; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:#fff; transition:all .2s ease;}
  .navpills a:hover{background:var(--maroon-dark); color:#fff; border-color:var(--maroon-dark);}
  @media (max-width:820px){ .navpills{display:none;} }

  .hero{position:relative; background:radial-gradient(120% 140% at 50% -10%, #86304a 0%, var(--maroon-dark) 55%, #33101c 100%); color:#fff; padding:78px 22px 66px; overflow:hidden; text-align:center;}
  .rosette{position:absolute; top:50%; left:50%; width:900px; height:900px; margin:-450px 0 0 -450px; animation:spin 140s linear infinite; pointer-events:none;}
  .rosette .rz-item{position:absolute; top:50%; left:50%;}
  .rosette .rz-item img{display:block; width:100%; height:100%; object-fit:contain; opacity:.24; filter:brightness(0) invert(1);}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes spin-rev{from{transform:rotate(360deg);}to{transform:rotate(0deg);}}
  @media (prefers-reduced-motion: reduce){ .rosette, .rosette *{animation:none !important;} }
  .hero-inner{position:relative; max-width:840px; margin:0 auto;}
  .hero .crest{height:64px; margin:0 auto 20px;}
  .hero .kicker-line{color:var(--gold-glow); font-size:14px; margin-bottom:16px;}
  .hero h1{font-size:clamp(28px,5vw,48px); color:#fff; margin:0 0 16px;}
  .hero p.lede{font-size:clamp(15.5px,2vw,18.5px); color:#f1e1d7; max-width:660px; margin:0 auto 34px;}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:760px; margin:0 auto;}
  .stat{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:16px 8px;}
  .stat b{display:block; font-family:'Aref Ruqaa'; font-size:clamp(22px,3.4vw,30px); color:var(--gold-glow); margin-bottom:4px;}
  .stat span{font-size:11.5px; color:#f1e1d7;}
  @media (max-width:640px){ .stat-row{grid-template-columns:repeat(2,1fr);} }

  .group{padding:60px 22px;}
  .group + .group{border-top:1px solid var(--line);}
  .group-inner{max-width:1200px; margin:0 auto;}
  .group-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:30px; flex-wrap:wrap;}
  .group-head h2{font-size:clamp(22px,3.2vw,29px); margin:0 0 8px;}
  .group-head p{margin:0; color:var(--ink-soft); font-size:14.5px; max-width:600px;}
  .group-badge{font-family:'Aref Ruqaa'; font-size:14px; color:var(--gold); background:var(--maroon-tint); padding:6px 16px; border-radius:999px; white-space:nowrap;}

  /* ---- day flow (inline, no modal) ---- */
  .dayflow{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(5,1fr); gap:14px;}
  @media (max-width:900px){ .dayflow{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .dayflow{grid-template-columns:1fr;} }
  .dayflow li{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 16px; box-shadow:var(--shadow); position:relative;}
  .dayflow li .dn{width:34px;height:34px;border-radius:50%;background:var(--maroon); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Aref Ruqaa'; font-size:15px; margin-bottom:10px;}
  .dayflow li .dtime{font-size:12px; color:var(--gold); font-weight:700; margin-bottom:6px;}
  .dayflow li h4{font-size:14.5px; margin:0 0 6px; color:var(--maroon-dark);}
  .dayflow li p{font-size:12.5px; color:var(--ink-soft); margin:0;}
  .dayflow .arrow-between{display:none;}
  @media (min-width:561px){
    .dayflow li:not(:last-child)::after{content:"←"; position:absolute; top:50%; left:-18px; transform:translateY(-50%); color:var(--gold); font-size:16px; z-index:2;}
  }

  /* ---- tiles ---- */
  .tilegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px;}
  .tile{position:relative; background:#fff; border-radius:20px 20px 14px 14px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; border:1px solid var(--line); transition:transform .22s ease, box-shadow .22s ease; display:flex; flex-direction:column;}
  .tile:hover{transform:translateY(-5px); box-shadow:0 20px 40px -16px rgba(74,22,38,.45);}
  .tile:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .tile-dome{height:70px; width:100%; flex:0 0 auto; background:linear-gradient(150deg,var(--maroon-light),var(--maroon-dark)); border-radius:50% 50% 0 0/100% 100% 0 0; display:flex; align-items:center; justify-content:center; color:var(--gold-glow); font-family:'Aref Ruqaa'; font-size:24px; position:relative;}
  .tile-dome::after{content:""; position:absolute; inset:8px; border:1px solid rgba(239,203,120,.35); border-radius:50% 50% 0 0/100% 100% 0 0;}
  .tile-body{padding:16px 18px 20px; flex:1; display:flex; flex-direction:column;}
  .tile-body h3{font-size:16px; margin:0 0 8px; font-family:'Tajawal'; font-weight:700; color:var(--maroon-dark);}
  .tile-body p{font-size:13.5px; color:var(--ink-soft); margin:0; flex:1;}
  .tile-cta{margin-top:12px; font-size:12.5px; color:var(--gold); font-weight:700; display:flex; align-items:center; gap:6px;}
  .tile-cta .arrow{transition:transform .2s ease;}
  .tile:hover .tile-cta .arrow{transform:translateX(-4px);}
  .tile.day .tile-dome{background:linear-gradient(150deg,#7c2c44,#3d1220);}
  .tile.solution .tile-dome{background:linear-gradient(150deg,#8a6a2c,#5c4718);}

  /* ---- modal ---- */
  .modal-overlay{position:fixed; inset:0; background:rgba(30,17,20,.6); backdrop-filter:blur(4px); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s ease; display:flex; align-items:center; justify-content:center; padding:22px;}
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal{background:var(--cream); width:min(780px,100%); max-height:88vh; border-radius:22px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,.4); transform:scale(.92) translateY(14px); transition:transform .28s cubic-bezier(.2,.9,.3,1.1);}
  .modal-overlay.open .modal{transform:scale(1) translateY(0);}
  .modal-head{background:linear-gradient(135deg,var(--maroon),var(--maroon-dark)); color:#fff; padding:22px 26px; display:flex; align-items:center; gap:16px; flex:0 0 auto; position:relative;}
  .modal-head .mn{flex:0 0 auto; width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-family:'Aref Ruqaa'; font-size:20px; color:var(--gold-glow);}
  .modal-head .mt{flex:1;}
  .modal-head h3{color:#fff; margin:0 0 3px; font-size:19px;}
  .modal-head .mtag{font-size:12px; color:var(--gold-light);}
  .modal-close{flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.08); color:#fff; cursor:pointer; font-size:15px;}
  .modal-close:hover{background:rgba(255,255,255,.22);}
  .modal-body{padding:24px 26px 30px; overflow-y:auto;}
  .modal-nav{display:flex; justify-content:space-between; padding:14px 22px; border-top:1px solid var(--line); background:#fff; flex:0 0 auto;}
  .modal-nav button{background:none; border:1px solid var(--line); border-radius:999px; padding:8px 18px; font-family:'Tajawal'; font-size:13.5px; color:var(--maroon-dark); cursor:pointer; display:flex; align-items:center; gap:6px;}
  .modal-nav button:hover{background:var(--paper);}
  .modal-nav button:disabled{opacity:.35; cursor:not-allowed;}

  .mf{margin-bottom:20px;}
  .mf h5{margin:0 0 8px; font-size:12px; color:var(--gold); letter-spacing:.3px; font-weight:700; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .mf p{font-size:15px; color:var(--ink-soft); margin:0 0 10px;}
  .mf ul{margin:0 0 10px; padding-inline-start:20px;}
  .mf ul li{margin-bottom:8px; color:var(--ink-soft); font-size:14.5px;}
  .mf ul li::marker{color:var(--gold);}

  /* gap comparison panels */
  .gap3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:14px 0;}
  @media (max-width:680px){ .gap3{grid-template-columns:1fr;} }
  .gap3 .panel{border-radius:14px; padding:16px 16px; }
  .gap3 .panel h6{margin:0 0 10px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .gap3 .panel ul{margin:0; padding-inline-start:18px; font-size:13px;}
  .gap3 .panel ul li{margin-bottom:8px;}
  .gap3 .current{background:var(--risk-tint);}
  .gap3 .current h6{color:var(--risk);}
  .gap3 .current ul li::marker{color:var(--risk);}
  .gap3 .target{background:var(--target-tint);}
  .gap3 .target h6{color:var(--target);}
  .gap3 .target ul li::marker{color:var(--target);}
  .gap3 .risk{background:var(--maroon-tint);}
  .gap3 .risk h6{color:var(--maroon-dark);}
  .gap3 .risk ul li::marker{color:var(--maroon-dark);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.c{background:var(--risk);} .dot.t{background:var(--target);} .dot.r{background:var(--maroon-dark);}

  /* day schedule inside modal */
  .blocklist{list-style:none; margin:0; padding:0;}
  .blocklist li{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; background:#fff;}
  .blocklist li .btime{display:inline-block; font-family:'Aref Ruqaa'; color:var(--gold); font-size:13.5px; background:var(--maroon-tint); padding:3px 12px; border-radius:999px; margin-bottom:8px;}
  .blocklist li h4{margin:0 0 6px; font-size:15px; color:var(--maroon-dark);}
  .blocklist li ul{margin:6px 0 0; padding-inline-start:18px; font-size:13.5px;}
  .blocklist li ul li{margin-bottom:5px; color:var(--ink-soft); border:none; padding:0; background:none;}

  .callout{background:var(--paper); border-inline-start:4px solid var(--gold); padding:14px 18px; border-radius:6px; margin:14px 0; font-size:14px; color:var(--ink-soft);}
  .callout strong{color:var(--maroon-dark);}

  footer{background:var(--maroon-dark); color:#e9d9d0; padding:40px 22px 26px; text-align:center; font-size:13px;}
  footer img{height:42px; margin:0 auto 12px;}
  footer .fname{font-family:'Aref Ruqaa'; font-size:19px; color:#fff; margin-bottom:6px;}

  .backtop{position:fixed; bottom:22px; left:22px; z-index:60; background:var(--maroon-dark); color:#fff; border:none; width:44px; height:44px; border-radius:50%; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s ease; font-size:16px; box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .backtop.show{opacity:1; pointer-events:auto;}
  .fulltable-wrap{overflow-x:auto; border-radius:16px; box-shadow:var(--shadow); border:1px solid var(--line);}
  table.sched{min-width:920px; width:100%; border-collapse:collapse; background:#fff;}
  table.sched th{background:var(--maroon-dark); color:#fff; padding:12px 10px; font-size:13px; text-align:center; vertical-align:middle; line-height:1.5;}
  table.sched th.daycol{background:var(--maroon)}
  table.sched td{border:1px solid var(--line); padding:12px 12px; vertical-align:top; font-size:13px; color:var(--ink-soft);}
  table.sched td.daycell{background:var(--paper); text-align:center; font-weight:700; color:var(--maroon-dark); font-size:14.5px; vertical-align:middle;}
  table.sched .cell-title{font-weight:700; color:var(--maroon-dark); display:block; margin-bottom:4px; font-size:13.5px;}
  table.sched ul{margin:0; padding-inline-start:16px;}
  table.sched ul li{margin-bottom:5px;}
  table.sched ul li::marker{color:var(--gold);}
  table.sched td.prayer{text-align:center; font-weight:700; color:var(--maroon-dark); background:var(--maroon-tint); vertical-align:middle;}
</style>
<style>

.gate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;overflow:auto}
.gate[hidden]{display:none}
.gc{width:min(100%,420px);background:#fff;color:#2A211D;border:1px solid rgba(227,198,126,.55);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.gc .gh{background:linear-gradient(135deg,#3A0F1E,#5B1A2E 60%,#7A2742);color:#fff;padding:26px 26px 22px;text-align:center;position:relative}
.gc .gh .mk{margin:0 auto 12px;width:52px;height:52px;border-radius:15px}
.gc .gh .mk:after{width:20px;height:20px;border-width:4px}
.gc .gh h1{font-size:24px}.gc .gh p{margin:6px 0 0;color:#E9DBB2;font-size:13.5px}
.gc form{padding:22px 26px 26px;display:grid;gap:14px}
.gc label{display:grid;gap:6px;font-size:13.5px;font-weight:600;color:#5B4F49}
.gc input{height:50px;border-radius:13px;border:2px solid #E1D3B0;background:#F5F1E8;color:#2A211D;font:inherit;font-size:16px;padding:0 14px}
.gc input:focus{border-color:#B8923F;outline:none}
.gc .pw{position:relative}.gc .pw input{width:100%;padding-inline-end:70px}
.gc .pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#6E2439;font-size:13px;font-weight:600;padding:6px 8px}
.gc .go{height:50px;border-radius:13px;border:1px solid #6E2439;background:#6E2439;color:#fff;font-weight:700;font-size:16px}
.gc .go:hover{background:#8C3350}.gc .go:disabled{opacity:.6;cursor:wait}
.gc .er{min-height:22px;color:#B3361F;font-size:13.5px;font-weight:600;text-align:center}
.gate{background:radial-gradient(120% 140% at 50% -10%,#86304a 0%,#4A1626 55%,#33101c 100%);font-family:'Tajawal',system-ui,sans-serif}
.gc .mk{flex:none;border:1.5px solid #E9DBB2;display:grid;place-items:center;background:rgba(255,255,255,.06)}.gc .mk:after{content:"";border-radius:50%;border:4px solid #E9DBB2;width:20px;height:20px}
.gc .gh h1{font-family:'Aref Ruqaa',serif;color:#fff}
</style><meta name="robots" content="noindex,nofollow"></head>

  <div class="er" id="ge" role="alert"></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openData(u,p){const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(u.trim().normalize('NFC')+'\u0000'+p),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.v)},key,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));}
(function(){const g=id=>document.getElementById(id);
 g('gt').onclick=()=>{const t=g('gp').type==='password';g('gp').type=t?'text':'password';g('gt').textContent=t?'إخفاء':'إظهار'};
 g('gf').addEventListener('submit',async e=>{e.preventDefault();g('ge').textContent='';
  if(!(window.crypto&&crypto.subtle)){g('ge').textContent='افتح الصفحة من رابط آمن (https) ليعمل الدخول.';return}
  g('gb').disabled=true;g('gb').textContent='جارٍ التحقق…';
  let P;try{P=await openData(g('gu').value,g('gp').value)}catch(err){g('ge').textContent='اسم المستخدم أو كلمة المرور غير صحيحة.';g('gb').disabled=false;g('gb').textContent='دخول';g('gp').select();return}
  document.body.innerHTML=P.html;
  const s=document.createElement('script');s.textContent=P.js;document.body.appendChild(s);
 });g('gu').focus();})();
